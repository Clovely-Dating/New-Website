name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers the build whenever you push code

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/configure-pages@v4

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite outputs the compiled app to the 'dist' folder
          branch: gh-pages # Deploys the built site to this branch
